name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://budget:budget@localhost:5432/budget
      MOCK_AUTH: 'true'
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 迁移可执行性纳入门禁:任何提交的 migration 必须能在空库上 deploy 成功
      - run: npx prisma migrate deploy
      - run: npm run check-types
      - run: npm run lint
      - run: npm test
