services:
  postgres:
    image: postgres:16-alpine
    container_name: budget-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    ports:
      # 安全加固(审计 bm1-sup-compose.postgres-published-guessable-creds):仅绑回环,
      # 不再向局域网暴露带默认口令的数据库;远端访问走 SSH 隧道。
      - '127.0.0.1:5434:5432'
    volumes:
      - budget-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U budget -d budget']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  budget-pgdata:
